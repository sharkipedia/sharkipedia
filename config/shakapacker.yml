# Note: You must restart bin/shakapacker-dev-server for changes to take effect

default: &default
  source_path: app/javascript
  source_entry_path: packs
  # Shakapacker 9+ defaults to SWC; we stay on Babel (see package.json "babel").
  javascript_transpiler: babel
  public_root_path: public
  public_output_path: packs
  cache_path: tmp/cache/shakapacker
  webpack_compile_output: true

  # Additional paths webpack should lookup modules
  # ['app/assets', 'engine/foo/app/assets']
  additional_paths: []

  # Reload manifest.json on all requests so we reload latest compiled packs
  cache_manifest: false


  static_assets_extensions:
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .tiff
    - .ico
    - .svg
    - .eot
    - .otf
    - .ttf
    - .woff
    - .woff2

  extensions:
    - .jsx
    - .mjs
    - .js
    - .sass
    - .scss
    - .css
    - .module.sass
    - .module.scss
    - .module.css
    - .png
    - .svg
    - .gif
    - .jpeg
    - .jpg

development:
  <<: *default
  compile: true

  # Reference: https://webpack.js.org/configuration/dev-server/
  dev_server:
    # Defaults to HMR-less live reload.
    hmr: false
    host: localhost
    port: 3035
    server: http
    # Allow the dev server to accept requests from the Rails container via host "webpacker".
    allowed_hosts: "all"
    compress: true
    client:
      overlay:
        errors: true
        warnings: false
    headers:
      'Access-Control-Allow-Origin': '*'
      # Without this, Chrome's heuristic caching can pin a broken build in
      # the disk cache indefinitely — users then keep seeing the old error
      # even after the fix lands.
      'Cache-Control': 'no-store'
    static:
      watch:
        ignored: '**/node_modules/**'


test:
  <<: *default
  compile: true

  # Compile test packs to a separate directory
  public_output_path: packs-test

production:
  <<: *default

  # Production depends on precompilation of packs prior to booting for performance.
  compile: false


  # Cache manifest.json for performance
  cache_manifest: true
