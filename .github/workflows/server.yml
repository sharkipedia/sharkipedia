name: Server

# One-off server operations, run by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      command:
        description: Kamal command
        type: choice
        options:
          - accessory boot db
          - proxy reboot
          - accessory details all
          - proxy details
          - app details

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  kamal:
    runs-on: ubuntu-24.04-arm
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      PREVIEW_DB_PASSWORD: ${{ secrets.PREVIEW_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/kamal-setup
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - run: kamal ${{ inputs.command }}
