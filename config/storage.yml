test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# AWS keys live in the credentials: `aws_production` for production, `aws`
# (the development bucket) for everything else, including PR previews.
# AWS_KEY / AWS_SECRET / AWS_S3_BUCKET override them.
<% aws = Rails.application.credentials.dig((Rails.env.production? && ENV["PREVIEW"].blank?) ? :aws_production : :aws) || {} %>
amazon:
  service: S3
  access_key_id: <%= ENV["AWS_KEY"] || aws[:access_key_id] %>
  secret_access_key: <%= ENV["AWS_SECRET"] || aws[:secret_access_key] %>
  region: us-east-1
  bucket: <%= ENV["AWS_S3_BUCKET"] || aws[:bucket] %>
